server:
  port: 8082

spring:
  application:
    name: MATCH-SERVICE

  datasource:
    url: jdbc:postgresql://localhost:5432/matchdb
    username: postgres
    password: 1234

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

eureka:
  instance:
    prefer-ip-address: true

  client:
    service-url:
      defaultZone: http://localhost:8761/eureka